# Examples: Local Builds Scheduler Configuration File

settings:
  # Directory where session-level and job-specific logs will be stored.
  # Can be an absolute path or relative to the directory containing this config file.
  log_dir: "./logs"

  # If true, the execution halts immediately when any job fails.
  # Subsequent jobs in the queue will be marked as SKIPPED.
  stop_on_failure: true

jobs:
  # The first job (e.g., pulling latest code, running linters, cleaning files)
  - name: prepare
    cwd: "."
    env:
      BUILD_MODE: "debug"
    commands:
      - "echo 'Starting preparation phase...'"

  # The main compilation/build job
  - name: compile
    cwd: "."
    commands:
      - "echo 'Compiling debug artifacts...'"

  # The testing job, which only executes if the compilation job completes successfully
  - name: test
    cwd: "."
    env:
      pytest_options: "-v"
    commands:
      - "echo 'Running unit test suites...'"
